<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#07070c"/>
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Cyber Outer Frame -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="url(#cyber-grad)" stroke-width="8" opacity="0.5"/>
  
  <!-- Gaming Controller & GT Emblem -->
  <g filter="url(#glow)">
    <path d="M160 180 C130 180 90 200 80 260 C70 320 100 370 140 370 C165 370 180 350 200 330 L230 330 C240 330 250 340 256 340 C262 340 272 330 282 330 L312 330 C332 350 347 370 372 370 C412 370 442 320 432 260 C422 200 382 180 352 180 L160 180 Z" fill="none" stroke="url(#cyber-grad)" stroke-width="20" stroke-linejoin="round"/>
    <!-- D-PAD -->
    <path d="M140 230 V280 M115 255 H165" stroke="#00f0ff" stroke-width="12" stroke-linecap="round"/>
    <!-- ACTION BUTTONS -->
    <circle cx="370" cy="235" r="10" fill="#ff007f"/>
    <circle cx="345" cy="260" r="10" fill="#00f0ff"/>
    <circle cx="395" cy="260" r="10" fill="#7000ff"/>
    <circle cx="370" cy="285" r="10" fill="#00f0ff"/>
    <!-- CENTER GT TEXT -->
    <text x="256" y="270" font-family="'Arial Black', sans-serif" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="2">GT</text>
  </g>
</svg>
